site_name: Synaptus Documentation
site_description: Synaptus - a Python and Matlab/Octave toolbox for synthetic aperture and array imaging.

# theme:
#   name: "material"

# nav:
#   - Introduction: index.md
#   - API Reference: api.md


theme:
  name: "material"
  features:
    - content.code.copy

repo_url: https://github.com/mh-skjelvareid/synaptus

plugins:
- mkdocstrings:
    handlers:
      python:
        options:
          docstring_style: numpy
          docstring_options:
            ignore_init_summary: true
          members_order: source
          heading_level: 2
          show_root_heading: false
          show_source: true
          show_signature: true

nav:
  - Introduction: index.md
  - API Reference: api.md

markdown_extensions:
  - toc:
      toc_depth: 2
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
